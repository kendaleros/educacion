<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Curso Manager</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js"></script>
    <script src="auth.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="glass-card auth-card">
            <h1 class="auth-logo">Curso Manager</h1>
            <p class="auth-subtitle">Crea una cuenta para registrarte en los cursos</p>

            <div id="alert-container"></div>

            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label" for="reg-username">Nombre de Usuario</label>
                    <input class="form-control" type="text" id="reg-username" required placeholder="Ej: obed123">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Correo Electrónico</label>
                    <input class="form-control" type="email" id="reg-email" required placeholder="Ej: obed@example.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Contraseña</label>
                    <input class="form-control" type="password" id="reg-password" required placeholder="Mínimo 6 caracteres">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-confirm">Confirmar Contraseña</label>
                    <input class="form-control" type="password" id="reg-confirm" required placeholder="Repite tu contraseña">
                </div>

                <button class="btn btn-primary btn-full" type="submit">
                    Registrarse
                </button>
            </form>

            <div class="auth-switch">
                ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <script>
        // Check if user is already logged in
        AUTH.redirectIfLoggedIn();

        function showAlert(type, message) {
            const container = document.getElementById("alert-container");
            container.innerHTML = `
                <div class="alert alert-${type}">
                    <span>${message}</span>
                </div>
            `;
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById("reg-username").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const password = document.getElementById("reg-password").value;
            const confirm = document.getElementById("reg-confirm").value;

            // Simple checks
            if (password.length < 6) {
                showAlert("danger", "La contraseña debe tener al menos 6 caracteres.");
                return;
            }

            if (password !== confirm) {
                showAlert("danger", "Las contraseñas no coinciden.");
                return;
            }

            const res = AUTH.register(username, email, password);

            if (res.success) {
                window.location.href = "login.html?registered=true";
            } else {
                showAlert("danger", res.message);
            }
        }
    </script>
</body>
</html>
