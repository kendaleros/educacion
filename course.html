<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAN MARCOS</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script src="https://player.vimeo.com/api/player.js"></script>
    <script src="supabase.js"></script>
    <script src="app.js"></script>
    <script src="auth.js"></script>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="nav-container">
            <a href="dashboard.html" class="nav-brand">SAN MARCOS</a>
            <div class="nav-user">
                <div class="user-info">
                    <div id="header-username" class="user-username">Cargando...</div>
                    <div id="header-role" class="user-role">Estudiante</div>
                </div>
                <button class="btn btn-secondary btn-small" onclick="AUTH.logout()">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </header>

    <!-- Main visualizer layout -->
    <main>
        <div class="course-viewer-grid">
            <!-- Left Side: Video Player -->
            <div class="player-container">
                <div class="video-container">
                    <!-- Video player element or placeholder -->
                    <div id="player-placeholder" class="video-no-content">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
                        <h3>Selecciona un video para comenzar</h3>
                        <p style="margin-top: 4px;">Utiliza el panel lateral para elegir una lección.</p>
                    </div>
                    <video id="native-video-player" controls playsinline preload="metadata" style="display: none;"></video>
                    <iframe id="video-player" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display: none;"></iframe>
                </div>

                <!-- Active Video Info (YouTube Style) -->
                <div id="active-video-details" style="display: none;">
                    <h1 id="active-video-title" style="font-size: 1.5rem; margin: 16px 0 8px 0; color: var(--text-main); font-weight: 700;">Título de la Lección</h1>
                    
                    <div style="margin-bottom: 16px;">
                        <a href="dashboard.html" style="color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                            Volver al Dashboard
                        </a>
                    </div>

                    <div class="glass-card" style="padding: 20px; background: rgba(255, 255, 255, 0.5);">
                        <p id="active-video-desc" style="font-size: 0.95rem; white-space: pre-wrap; line-height: 1.6;"></p>
                    </div>
                </div>

                <div class="course-meta" style="margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--card-border);">
                    <h2 id="course-title" style="font-size: 1.1rem; margin-bottom: 8px; color: var(--text-muted); font-weight: 600;">Curso: Cargando...</h2>
                    <p id="course-desc" style="font-size: 0.9rem;"></p>
                </div>
            </div>

            <!-- Right Side: Sidebar Navigation -->
            <div class="sidebar-container">
                <div class="glass-card" style="padding: 24px; height: 100%;">
                    <h3 class="sidebar-title">Contenido del Curso</h3>
                    <div id="modules-accordion" style="margin-top: 16px;">
                        <!-- Modules accordions and videos -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Route Guard
        const currentUser = AUTH.checkAuth();

        let currentCourse = null;
        let activeVideoId = null;

        document.addEventListener("DOMContentLoaded", async () => {
            if (!currentUser) return;

            document.getElementById("header-username").innerText = currentUser.username;
            const roleEl = document.getElementById("header-role");
            if (currentUser.is_staff) {
                roleEl.innerText = "Administrador";
                roleEl.className = "user-role admin";
            } else {
                roleEl.innerText = "Estudiante";
                roleEl.className = "user-role student";
            }

            const urlParams = new URLSearchParams(window.location.search);
            const courseId = parseInt(urlParams.get("id"));

            if (!courseId) {
                window.location.href = "dashboard.html";
                return;
            }

            const courses = await DB.getCourses();
            currentCourse = courses.find(c => c.id === courseId);
            if (!currentCourse) {
                window.location.href = "dashboard.html";
                return;
            }

            document.getElementById("course-title").innerText = currentCourse.title;
            document.getElementById("course-desc").innerText = currentCourse.description;
            document.title = `${currentCourse.title} - SAN MARCOS`;

            await renderModulesAccordion();
            loadBestThumbnails();

            const videoId = parseInt(urlParams.get("video"));
            if (videoId) {
                await playVideo(videoId);
            } else {
                await loadFirstVideo();
            }
        });

        async function renderModulesAccordion() {
            const modules = (await DB.getModules())
                .filter(m => m.course_id === currentCourse.id)
                .sort((a, b) => a.order - b.order);

            const container = document.getElementById("modules-accordion");

            if (modules.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); font-style: italic; text-align: center;">No hay módulos para este curso aún.</p>`;
                return;
            }

            const allVideos = await DB.getVideos();

            container.innerHTML = modules.map(mod => {
                const videos = allVideos
                    .filter(v => v.module_id === mod.id)
                    .sort((a, b) => a.order - b.order);

                const videosHtml = videos.map((vid, index) => `
                    <li id="video-item-${vid.id}" class="playlist-video-item" onclick="playVideo(${vid.id})">
                        <div class="playlist-thumb-mini">
                            <img data-video-url="${escapeHTML(vid.video_url)}" src="https://i.imgur.com/sYV8Lyi.png" alt="${escapeHTML(vid.title)}" onerror="this.onerror=null; this.src='https://via.placeholder.com/160x90?text=Miniatura';" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                        </div>
                        <div class="playlist-meta">
                            <span class="playlist-title-mini">${index + 1}. ${escapeHTML(vid.title)}</span>
                            <span class="playlist-sub-mini">Lección ${index + 1}</span>
                        </div>
                    </li>
                `).join("");

                return `
                    <div class="accordion-item">
                        <button class="accordion-header" onclick="toggleAccordion(this)">
                            <span>${escapeHTML(mod.title)}</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(0deg); transition: transform 0.2s;"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="accordion-content">
                            <ul class="playlist-videos">
                                ${videosHtml || '<li class="playlist-video-item" style="cursor: default; pointer-events: none; font-style: italic;">Sin lecciones en este módulo</li>'}
                            </ul>
                        </div>
                    </div>
                `;
            }).join("");
        }

        function toggleAccordion(button) {
            const content = button.nextElementSibling;
            const icon = button.querySelector("svg");

            content.classList.toggle("open");
            icon.style.transform = content.classList.contains("open") ? "rotate(180deg)" : "rotate(0deg)";
        }

        // Try to load the best available thumbnail for each playlist item.
        function loadBestThumbnails() {
            const imgs = document.querySelectorAll('.playlist-thumb-mini img[data-video-url]');
            imgs.forEach(img => {
                const videoUrl = img.getAttribute('data-video-url');
                const candidates = (typeof getCandidateThumbnails === 'function') ? getCandidateThumbnails(videoUrl) : [];
                if (!candidates.length) return;

                // try each candidate in order until one loads
                let tried = 0;
                const tryNext = () => {
                    if (tried >= candidates.length) {
                        return;
                    }
                    const candidate = candidates[tried++];
                    const tester = new Image();
                    tester.onload = () => { img.src = candidate; };
                    tester.onerror = () => { tryNext(); };
                    tester.src = candidate;
                };

                tryNext();
            });
        }

        // run shortly after render
        setTimeout(loadBestThumbnails, 50);

        async function playVideo(id, autoStart = true) {
            const videos = await DB.getVideos();
            const video = videos.find(v => v.id === id);
            if (!video) return;

            document.querySelectorAll(".playlist-video-item").forEach(item => item.classList.remove("active"));

            const activeItem = document.getElementById(`video-item-${id}`);
            if (activeItem) {
                activeItem.classList.add("active");

                const contentDiv = activeItem.closest(".accordion-content");
                if (contentDiv && !contentDiv.classList.contains("open")) {
                    contentDiv.classList.add("open");
                    const accordionHeaderButton = contentDiv.previousElementSibling;
                    if (accordionHeaderButton) {
                        const icon = accordionHeaderButton.querySelector("svg");
                        if (icon) icon.style.transform = "rotate(180deg)";
                    }
                }
            }

            activeVideoId = id;

            const player = document.getElementById("video-player");
            const nativePlayer = document.getElementById("native-video-player");
            const placeholder = document.getElementById("player-placeholder");
            const details = document.getElementById("active-video-details");
            const videoContainer = player.closest(".video-container");

            placeholder.style.display = "none";
            details.style.display = "block";

            let embedUrl = getEmbedUrl(video.video_url, { autoplay: autoStart });
            const provider = getVideoProvider(video.video_url);

            if (videoContainer) {
                videoContainer.classList.remove("video-provider-youtube", "video-provider-vimeo", "video-provider-drive", "video-provider-odysee", "video-provider-generic", "video-mode-native", "video-mode-embed");
                videoContainer.classList.add(`video-provider-${provider}`);
            }

            player.style.display = "none";
            player.src = "";
            nativePlayer.pause();
            nativePlayer.removeAttribute("src");
            nativePlayer.style.display = "none";
            nativePlayer.onerror = null;

            if (provider === "drive") {
                const directUrl = getGoogleDriveDirectUrl(video.video_url);
                if (directUrl) {
                    if (videoContainer) videoContainer.classList.add("video-mode-native");
                    nativePlayer.src = directUrl;
                    nativePlayer.style.display = "block";
                    nativePlayer.load();

                    nativePlayer.onerror = () => {
                        if (videoContainer) {
                            videoContainer.classList.remove("video-mode-native");
                            videoContainer.classList.add("video-mode-embed");
                        }
                        nativePlayer.style.display = "none";
                        nativePlayer.removeAttribute("src");
                        player.src = embedUrl;
                        player.style.display = "block";
                    };

                    if (autoStart) {
                        nativePlayer.play().catch(() => {});
                    }
                } else {
                    if (videoContainer) videoContainer.classList.add("video-mode-embed");
                    player.src = embedUrl;
                    player.style.display = "block";
                }
            } else {
                if (videoContainer) videoContainer.classList.add("video-mode-embed");
                player.src = embedUrl;
                player.style.display = "block";
            }
            
            document.getElementById("active-video-title").innerText = video.title;
            document.getElementById("active-video-desc").innerText = video.description || "Esta lección no tiene descripción adicional.";

            if (videoContainer) {
                videoContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            const newurl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?id=${currentCourse.id}&video=${id}`;
            window.history.replaceState({ path: newurl }, '', newurl);
        }

        async function loadFirstVideo() {
            const modules = (await DB.getModules())
                .filter(m => m.course_id === currentCourse.id)
                .sort((a, b) => a.order - b.order);

            if (modules.length === 0) return;

            const allVideos = await DB.getVideos();

            for (const mod of modules) {
                const videos = allVideos
                    .filter(v => v.module_id === mod.id)
                    .sort((a, b) => a.order - b.order);

                if (videos.length > 0) {
                    await playVideo(videos[0].id, true);
                    break;
                }
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }
    </script>
</body>
</html>
